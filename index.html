<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>救護速查</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#dfe3e8;--ac:#c62828;--ac2:#fdecea;--pa:#f9a825;--pb:#fff8e1;--dr:#1565c0;--dr2:#e3f2fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#e8eaed;--mu:#98a2b3;--bd:#333a42;--ac:#ef5350;--ac2:#3a2020;--pb:#33290f;--dr:#64b5f6;--dr2:#16283a}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#e8eaed;--mu:#98a2b3;--bd:#333a42;--ac:#ef5350;--ac2:#3a2020;--pb:#33290f;--dr:#64b5f6;--dr2:#16283a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tab{padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tab.drug{border-color:var(--dr);color:var(--dr)}
.tab.drug.on{background:var(--dr);color:#fff}
.tab small{display:block;font-weight:400;font-size:10px;opacity:.8}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.chips{display:flex;gap:8px;margin-bottom:10px}
.chip{padding:6px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pa);border-color:var(--pa);color:#1b1f24;font-weight:700}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden}
.item.p{border-left:5px solid var(--pa);background:linear-gradient(90deg,var(--pb),var(--card) 40%)}
.hd{display:flex;gap:10px;align-items:center;padding:12px;cursor:pointer}
.hd b{flex:1}
.code{background:var(--ac2);color:var(--ac);font-weight:700;border-radius:6px;padding:2px 8px;font-size:13px;min-width:48px;text-align:center}
.drug .code{background:var(--dr2);color:var(--dr)}
.pb{background:var(--pa);color:#1b1f24;font-weight:800;border:2px solid #1b1f24;border-radius:5px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.bd{display:none;padding:0 12px 12px;border-top:1px solid var(--bd)}
.item.open .bd{display:block}
.txt{white-space:pre-wrap;margin:10px 0}
.fr{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;margin:10px 0;padding:10px;background:var(--dr2);border-radius:8px}
.fr dt{font-weight:700;color:var(--dr);font-size:13px}
.fr dd{margin:0}
.dgh{font-weight:700;margin:10px 0 6px}.dg{margin-bottom:6px;border:1px solid var(--dr);border-radius:8px;overflow:hidden}.dgt{padding:9px 12px;font-weight:700;color:var(--dr);cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:space-between}.dgt:after{content:"▾";margin-left:auto}.dg .fr{display:none;margin:0;border-radius:0}.dg.open .fr{display:grid}
.ban{background:var(--pb);border:1px dashed var(--pa);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.mu{color:var(--mu);font-size:13px}
.btn{display:inline-block;padding:10px 14px;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;text-decoration:none}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚑 救護速查 <span class="mu" id="ver"></span></h1>
  <div class="tabs" id="tabs"></div>
  <input id="q" placeholder="搜尋代碼、標題、重點、藥名…">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>
<script>
var INLINE=null; /*__INLINE__*/
var D=null, cur=0, flt="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function hay(x){return x.code+x.title+(x.summary||"")+(x.drugs||[]).map(function(g){return g.name+g.f.map(function(a){return a.join("")}).join("")}).join("");}
function draw(){
  var M=D.menus[cur], isDrug=M.key=="drug";
  document.getElementById("ver").textContent="資料更新 "+D.updated;
  document.getElementById("tabs").innerHTML=D.menus.map(function(m,i){return '<button class="tab'+(m.key=="drug"?' drug':'')+(i==cur?' on':'')+'" data-i="'+i+'">'+esc(m.name)+'<small>'+esc(m.sub)+'</small></button>';}).join("");
  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){cur=+b.dataset.i;flt="";document.getElementById("q").value="";draw();};});
  var np=M.items.filter(function(x){return x.p;}).length, nd=M.items.filter(function(x){return x.drugs;}).length;
  function chip(k,t){return '<button class="chip'+(flt==k?' on':'')+'" data-k="'+k+'">'+t+'</button>';}
  document.getElementById("chips").innerHTML=(np||nd)?chip("","全部 "+M.items.length)+(np?chip("p","🅿 只看 P 項目 "+np):"")+(nd?chip("d","💊 含藥物 "+nd):""):"";
  document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){flt=b.dataset.k;draw();};});
  var q=document.getElementById("q").value.trim().toLowerCase();
  var arr=M.items.filter(function(x){return (!flt||(flt=="p"?x.p:x.drugs))&&(!q||hay(x).toLowerCase().indexOf(q)>-1);});
  var h=(M.banner?'<div class="ban">'+esc(M.banner)+'</div>':'')+arr.map(function(x){
    var body='<div class="txt">'+(x.summary?esc(x.summary):'<span class="mu">（重點整理中）</span>')+'</div>'
      +(x.drugs?'<div class="dgh">💊 藥物（點藥名看劑量與使用時機）</div>'+x.drugs.map(function(g){return '<div class="dg"><div class="dgt"><span>'+esc(g.name)+'</span>'+(g.p?'<span class="pb">P</span>':'')+'</div><dl class="fr">'+g.f.map(function(a){return '<dt>'+esc(a[0])+'</dt><dd>'+esc(a[1])+'</dd>';}).join("")+'</dl></div>';}).join(""):'');
    return '<div class="item'+(x.p?' p':'')+(isDrug?' drug':'')+'"><div class="hd"><span class="code">'+esc(x.code)+'</span><b>'+esc(x.title)+'</b>'+(x.drugs?'<span title="含藥物">💊</span>':'')+(x.p?'<span class="pb" title="高級救護技術員（P）項目">P</span>':'')+'</div><div class="bd">'
     +body+(x.note?'<div class="mu">'+esc(x.note)+'</div>':'')
     +(x.pdf?'<p>'+(INLINE?'<span class="mu">預覽版無法開啟 PDF，正式網站才可以</span>':'<a class="btn" href="'+esc(x.pdf)+'" target="_blank" rel="noopener">開啟完整 PDF</a>')+'</p>':'')
     +'</div></div>';}).join("");
  document.getElementById("list").innerHTML=h||'<div class="empty">'+(q?'找不到符合的資料':'這個選單還沒有資料')+'</div>';
  document.querySelectorAll(".dgt").forEach(function(e){e.onclick=function(){e.parentNode.classList.toggle("open");};});
  document.querySelectorAll(".hd").forEach(function(e){e.onclick=function(){e.parentNode.classList.toggle("open");};});
}
document.getElementById("q").oninput=draw;
if(INLINE){D=INLINE;draw();}
else fetch("data.json?t="+Date.now()).then(function(r){return r.json();}).then(function(j){D=j;draw();})
 .catch(function(){document.getElementById("list").innerHTML='<div class="empty">讀不到 data.json，請從網址開啟，不要直接點檔案</div>';});
</script>
</body>
</html>
